# Qingyu Resume API only. Existing roomai.top virtual hosts stay independent.
server {
    listen 80;
    listen [::]:80;
    server_name resume.roomai.top;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingyu-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://resume.roomai.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name resume.roomai.top;
    ssl_certificate /etc/letsencrypt/live/resume.roomai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.roomai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
        proxy_send_timeout 20s;
    }
}
