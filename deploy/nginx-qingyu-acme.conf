# Temporary HTTP validation host before the independent HTTPS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name resume.roomai.top;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingyu-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
